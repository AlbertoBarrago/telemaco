[workspace]
resolver = "2"
members = [
    "crates/telemaco-dom",
    "crates/telemaco-net",
    "crates/telemaco-browser",
    "crates/telemaco-cdp",
    "crates/telemaco-js",
    "crates/telemaco-mcp",
    "crates/telemaco-render",
    "crates/telemaco-cli",
    "crates/telemaco",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AlbertoBarrago/telemaco"
homepage = "https://github.com/AlbertoBarrago/telemaco"
rust-version = "1.85"
authors = ["Alberto Barrago"]

[workspace.dependencies]
telemaco-dom = { path = "crates/telemaco-dom", version = "0.2.0" }
telemaco-net = { path = "crates/telemaco-net", version = "0.2.0" }
telemaco-browser = { path = "crates/telemaco-browser", version = "0.2.0" }
telemaco-cdp = { path = "crates/telemaco-cdp", version = "0.2.0" }
telemaco-js = { path = "crates/telemaco-js", version = "0.2.0" }
telemaco-mcp = { path = "crates/telemaco-mcp", version = "0.2.0" }
telemaco-render = { path = "crates/telemaco-render", version = "0.2.0" }

html5ever = "0.39"
markup5ever = "0.39"
selectors = "0.26"
servo_arc = "0.4"
cssparser = "0.34"
# Layout engine for the optional render layer (telemaco-render). Pure Rust.
# `mentore` is the Telemaco-maintained fork of Taffy (same lib name `taffy`,
# so `use taffy::` keeps compiling unchanged) pinned to the exact version the
# vendored tree built against, so the layout never changes on a fresh resolve.
taffy = { version = "=0.12.1", package = "mentore" }
# CPU-only pure-Rust 2D rasterizer for the render layer's paint step.
tiny-skia = "0.12"
# Pure-Rust glyph rasterizer for the render layer's text step.
ab_glyph = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
# No "cookies" feature: telemaco manages cookies through its own CookieJar
# (telemaco-net/src/cookies.rs) and never uses reqwest's cookie store. Pulling
# it in only added the cookie/cookie_store crates, and cookie 0.18.1's blanket
# From impl fails to compile under coherence on some toolchains (issue #295).
reqwest = { version = "0.12", features = ["gzip", "brotli", "deflate", "rustls-tls", "socks"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Config-file format for the MCP extraction limits. TOML so the file can carry
# comments explaining why a limit was raised; serde_json is already present but
# JSON cannot.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"

[patch.crates-io]
# Removed: the taffy and cosmic-text patches pointing at vendor/ cannot travel
# to crates.io (a [patch] is a local build directive, not something a published
# crate carries). telemaco-render now depends on the published forks mentore and
# athena-text directly, which expose the same lib names (taffy / cosmic_text).
# The vendor/ directories are no longer referenced and are kept for reference.

# Unwinding (the Rust default) is REQUIRED for the anti-panic protocol: ops wrap
# their bodies in std::panic::catch_unwind so a panic degrades to an error return
# instead of unwinding into V8's FFI frame and aborting the process. panic="abort"
# would turn every catchable op panic into a hard crash.
[profile.release]
panic = "unwind"
