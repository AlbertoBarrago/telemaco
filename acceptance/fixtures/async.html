<!DOCTYPE html><html><head><meta charset="utf-8"><title>Async</title></head>
<body><p id="out">PENDING</p><script>
(async function(){
  const v = await Promise.resolve('RESOLVED');
  await new Promise(r => setTimeout(r, 10));
  document.getElementById('out').textContent = 'ASYNC:' + v;
})();
</script></body></html>
