<!DOCTYPE html><html><head><meta charset="utf-8"><title>Fetch</title></head>
<body><p id="out">PENDING</p><script>
fetch('/data.json').then(r => r.json())
  .then(d => { document.getElementById('out').textContent = 'FETCH:' + d.value; })
  .catch(e => { document.getElementById('out').textContent = 'FETCH-ERROR'; });
</script></body></html>
