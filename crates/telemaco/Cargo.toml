[package]
name = "telemaco"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embeddable Rust API for Telemaco, a headless browser engine with a real DOM, V8 and native layout."
keywords = ["headless", "browser", "scraping", "automation", "v8"]
categories = ["web-programming", "api-bindings"]
readme = "README.md"
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["api"]
api = ["telemaco-browser", "telemaco-net", "tokio"]
stealth = ["api", "telemaco-browser/stealth"]
render = ["api", "telemaco-browser/render"]

[dependencies]
telemaco-browser = { path = "../telemaco-browser", version = "0.2.0", optional = true }
telemaco-net = { path = "../telemaco-net", version = "0.2.0", optional = true }
anyhow = "1"
tokio = { version = "1", features = ["rt"], optional = true }
thiserror = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[[example]]
name = "basic"
required-features = ["stealth"]
