[package]
name = "telemaco-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native interactive window over the Telemaco headless browser engine"

[lib]
name = "telemaco_gui"
path = "src/lib.rs"

[[bin]]
name = "telemaco-gui"
path = "src/main.rs"

[features]
default = ["render"]
# Stealth transport and fingerprint surface, same chain as the CLI.
stealth = ["telemaco-cdp/stealth"]
# Required: the page surface is rendered by telemaco-render through
# Page.captureScreenshot.
render = ["telemaco-cdp/render"]

[dependencies]
telemaco-cdp = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
# PNG decode of captured frames; same version/feature set telemaco-cdp uses.
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = "0.29"