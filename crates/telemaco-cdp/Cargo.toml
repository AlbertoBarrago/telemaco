[package]
name = "telemaco-cdp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
stealth = ["telemaco-browser/stealth"]
# Enable Page.captureScreenshot via telemaco-render. Propagates render to
# telemaco-browser so Page::screenshot is available.
render = ["telemaco-browser/render", "dep:image", "dep:png"]

[dependencies]
telemaco-dom = { workspace = true }
telemaco-browser = { workspace = true }
telemaco-js = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
futures-util = "0.3"
telemaco-net = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
png = { version = "0.18", optional = true }

[target.'cfg(target_env = "gnu")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
