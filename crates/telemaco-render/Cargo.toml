[package]
name = "telemaco-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["layout", "paint", "screenshot", "pdf", "headless"]
categories = ["web-programming", "graphics"]
homepage.workspace = true
rust-version.workspace = true
# ~10 MB of embedded emoji bitmaps would put the package over the 10 MiB
# crates.io limit on its own. build.rs detects its absence and the registry
# build falls back to monochrome emoji; the git tree and the release binaries
# keep the face.
exclude = ["assets/noto-color-emoji.ttf"]
description = "Render layer for Telemaco: layout (taffy), text shaping and raster output for screenshots and PDF."

[dependencies]
serde = { workspace = true }
taffy = { workspace = true }
telemaco-dom = { workspace = true }
tiny-skia = { workspace = true }
ab_glyph = { workspace = true }
# Real inline text layout: HarfBuzz-class shaping (rustybuzz) + UAX#14 line
# breaking, the same algorithms browsers use. Built with only our embedded
# fonts (no system-font scan) so layout stays deterministic across hosts.
# `athena-text` is the Telemaco fork of cosmic-text (same lib name `cosmic_text`,
# so `use cosmic_text::` compiles unchanged) pinned to an exact version so text
# shaping never changes on a fresh resolve.
cosmic-text = { version = "=0.14.2", package = "athena-text", default-features = false, features = ["std", "swash"] }
# Keep this exactly aligned with cosmic-text 0.14's raster backend. Cosmic
# and the renderer consume the same canonical variation coordinates for
# shaping and rasterization.
swash = { version = "=0.2.0", default-features = false, features = ["std", "scale", "render"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
ureq = { version = "2.9", default-features = false, features = ["tls"] }
base64 = { workspace = true }
# SVG rasterization for <img src="*.svg">, inline <svg>, and background-image
# SVGs, all extremely common for logos/icons. Pure Rust, CPU, no system deps,
# same deterministic-rendering guarantee as the rest of this crate.
resvg = { version = "0.47", default-features = false, features = ["text", "raster-images"] }
usvg = { version = "0.47", default-features = false }
url = { workspace = true }
cssparser = "0.34"
wuff = { version = "0.2.7" }
# Same `log` instance usvg emits glyph-fallback warnings through, so tests can
# install a collector and assert on them.
[dev-dependencies]
log = "0.4"

[lib]
path = "src/lib.rs"

[[bin]]
name = "paint_file"
path = "src/bin/paint_file.rs"
