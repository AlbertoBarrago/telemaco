name: Docker

on:
  push:
    tags:
      - 'v*'
  # Manual publish, so the image can be rebuilt without inventing a tag.
  # Dispatch against a tag ref to republish that release; against a branch it
  # takes the version from the manifest and does not touch `latest`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per architecture, each on its own native runner. Building arm64
  # under QEMU works but compiles V8 emulated, which turned a minutes-long
  # build into hours. release.yml already builds aarch64 natively; this
  # matches it.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      configured: ${{ steps.creds.outputs.configured }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      # Publishing needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. Without them
      # the login step fails and every tag leaves a red workflow behind, which
      # is noise rather than signal: a repo that does not publish images should
      # skip this job, not fail it.
      - name: Check Docker Hub credentials
        id: creds
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME is not set; skipping the image publish."
          fi

      - if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve the version to publish
        if: steps.creds.outputs.configured == 'true'
        id: version
        run: |
          set -euo pipefail
          # On a tag the tag is the version. On a manual run from a branch there
          # is no tag to strip, and the untouched ref would become the image tag
          # (`refs/heads/main`), so the manifest decides and `latest` is left
          # pointing at the last real release.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            release=true
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            release=false
            echo "::notice::Not a tag ref; publishing $version without moving latest."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        if: steps.creds.outputs.configured == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push by digest rather than by tag: the two architecture jobs would
      # otherwise race, each overwriting the other's tag. The merge job below
      # assembles them into one multi-arch tag.
      - name: Build and push by digest
        if: steps.creds.outputs.configured == 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            TELEMACO_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/telemaco,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export the digest
        if: steps.creds.outputs.configured == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          # The bare hash, without the `sha256:` prefix: upload-artifact rejects
          # a colon in a filename, and the merge job puts the prefix back when
          # it reassembles the reference.
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: needs.build.outputs.configured == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the multi-arch tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/telemaco
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:$VERSION")
          if [ "$RELEASE" = "true" ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
