name: Docs

# Regenerate the self-hosted rustdoc and commit it to `api/` on main, where
# GitHub Pages serves it at albz.it/telemaco/api.
#
# Why self-hosted: the V8-embedding crates (telemaco-js and everything that
# depends on it) cannot be rendered by docs.rs, which cannot compile V8 in its
# build sandbox. The light crates (dom, net, render, cli) stay on docs.rs.
#
# Manual dispatch plus a tag-triggered job. Deliberately NOT triggered by
# push-to-main: the job commits `api/` back to main, and a main trigger would
# re-run itself forever.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  OPENSSL_NO_VENDOR: "1"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - name: Generate rustdoc
        run: cargo doc --no-deps --workspace

      - name: Stage doc into api/
        run: |
          rm -rf api
          cp -a target/doc api
          cp scripts/api-index.html api/index.html

      - name: Commit regenerated docs
        id: commit
        run: |
          git config user.name "telemaco-docs[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api
          if git diff --cached --quiet; then
            echo "No changes to api/; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: regenerate rustdoc in api/"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to main
        if: steps.commit.outputs.changed == 'true'
        # HEAD:main instead of main: on a tag-triggered run the checkout is a
        # detached HEAD with no local `main` branch, so `git push origin main`
        # fails with "src refspec main does not match any". Pushing the current
        # commit to the remote branch works for both the tag and dispatch paths.
        run: git push origin HEAD:main
